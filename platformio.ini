; IPAS - ESP32-C3-SUPERMINI firmware (Arduino framework, PlatformIO)
; The ESP32 is the sensor controller, Wi-Fi access point and web server.

[env:esp32-c3-supermini]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1          ; generic ESP32-C3, 4 MB flash; SuperMini is compatible
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs   ; dashboard files in data/ are uploaded with `pio run -t uploadfs`
board_build.partitions = default.csv
lib_deps =
    adafruit/Adafruit BME680 Library @ ^2.0.5
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -DARDUINO_USB_MODE=1            ; native USB serial on the SuperMini (no UART chip)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; ---- Project settings (override here instead of editing config.h) ----
    ; -DIPAS_AP_SSID=\"IPAS-Sensor\"
    ; -DIPAS_AP_PASSWORD=\"ipas1234\"
    ; -DIPAS_I2C_SDA=8
    ; -DIPAS_I2C_SCL=9
